name: build-installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          modules: "all"
          cache: true

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build PaperNote
        shell: cmd
        run: build_windows.bat non_portable

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows\papernote.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PaperNote-Windows-Setup
          path: dist/PaperNote-Setup-*.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt6 and build deps
        run: |
          brew install qtbase qtdeclarative qtsvg qtspeech harfbuzz
          echo "$(brew --prefix qtbase)/bin" >> "$GITHUB_PATH"

      - name: Build DMG
        env:
          QMAKE: /opt/homebrew/opt/qtbase/bin/qmake
        run: |
          chmod +x scripts/build_macos_dmg.sh
          ./scripts/build_macos_dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: PaperNote-macOS-DMG
          path: dist/*.dmg
